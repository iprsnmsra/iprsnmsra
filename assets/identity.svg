<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d"><title id="t">How the work moves</title><desc id="d">Six-stage pipeline: problem, abstraction, pattern, implementation, verification, world, with an iteration loop back to the start.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#18212C"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B8CFF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7A8C"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFB347"/></marker></defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#6B7A8C}.mi{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;fill:#E8ECF1}.ma{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10.5px;fill:#FFB347}.s{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:700;fill:#E8ECF1}.f{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#E8ECF1}</style><rect width="1000" height="360" fill="#090D12"/><rect width="1000" height="360" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="359" fill="none" stroke="#1B2430"/><path d="M10 2H22M2 10V22" stroke="#6B7A8C" fill="none"/><path d="M990 2H978M998 10V22" stroke="#6B7A8C" fill="none"/><path d="M10 358H22M2 350V338" stroke="#6B7A8C" fill="none"/><path d="M990 358H978M998 350V338" stroke="#6B7A8C" fill="none"/><text x="30" y="34" class="m" fill="#5B8CFF" style="fill:#5B8CFF">01 / identity</text><text x="970" y="34" class="m" text-anchor="end">pipeline: problem → world</text><path d="M90 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M255 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M420 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M585 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M750 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M915 70V300" stroke="#1B2430" stroke-dasharray="2 5"/><path d="M90 150H915" stroke="#2A3849" stroke-width="2"/><circle cx="90" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="90" cy="150" r="3" fill="#5B8CFF"/><text x="90" y="116" class="s" text-anchor="middle" font-size="16">problem</text><text x="90" y="188" class="mi" text-anchor="middle" >requirements</text><text x="90" y="206" class="m" text-anchor="middle" >impact analysis</text><path d="M106 150H237" stroke="#5B8CFF" marker-end="url(#ar)"/><circle cx="255" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="255" cy="150" r="3" fill="#5B8CFF"/><text x="255" y="116" class="s" text-anchor="middle" font-size="16">abstraction</text><text x="255" y="188" class="mi" text-anchor="middle" >dsa · 500+ solved</text><text x="255" y="206" class="m" text-anchor="middle" >leetcode</text><path d="M271 150H402" stroke="#5B8CFF" marker-end="url(#ar)"/><circle cx="420" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="420" cy="150" r="3" fill="#5B8CFF"/><text x="420" y="116" class="s" text-anchor="middle" font-size="16">pattern</text><text x="420" y="188" class="mi" text-anchor="middle" >150+ design patterns</text><text x="420" y="206" class="m" text-anchor="middle" >awesome-Modern-SE-Algorithms</text><path d="M436 150H567" stroke="#5B8CFF" marker-end="url(#ar)"/><circle cx="585" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="585" cy="150" r="3" fill="#5B8CFF"/><text x="585" y="116" class="s" text-anchor="middle" font-size="16">implementation</text><text x="585" y="188" class="mi" text-anchor="middle" >c++ · java · python</text><text x="585" y="206" class="m" text-anchor="middle" >javascript · sql</text><path d="M601 150H732" stroke="#5B8CFF" marker-end="url(#ar)"/><circle cx="750" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="750" cy="150" r="3" fill="#5B8CFF"/><text x="750" y="116" class="s" text-anchor="middle" font-size="16">verification</text><text x="750" y="188" class="mi" text-anchor="middle" >github actions</text><text x="750" y="206" class="m" text-anchor="middle" >5 languages at once</text><path d="M766 150H897" stroke="#5B8CFF" marker-end="url(#ar)"/><circle cx="915" cy="150" r="9" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="915" cy="150" r="3" fill="#FFB347"/><text x="915" y="116" class="s" text-anchor="middle" font-size="16">world</text><text x="915" y="188" class="mi" text-anchor="middle" >vercel deploys</text><text x="915" y="206" class="m" text-anchor="middle" >unity · unreal</text><circle r="4" fill="#FFB347"><animateMotion path="M90 150H915" dur="8s" begin="0s" repeatCount="indefinite"/></circle><path d="M915 228V318H90V228" fill="none" stroke="#6B7A8C" stroke-dasharray="4 4" marker-end="url(#ard)"/><text x="500" y="336" class="f" text-anchor="middle" font-size="15">iterate — every world raises the next problem</text></svg>
