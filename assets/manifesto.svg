<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d"><title id="t">Drive</title><desc id="d">A short brief on a builder driven by tools, solutions, agentic AI and game development, beside an orbit diagram of those four domains.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#18212C"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B8CFF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7A8C"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFB347"/></marker></defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#6B7A8C}.mi{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;fill:#E8ECF1}.ma{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10.5px;fill:#FFB347}.s{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:700;fill:#E8ECF1}.f{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#E8ECF1}</style><rect width="1000" height="430" fill="#090D12"/><rect width="1000" height="430" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="429" fill="none" stroke="#1B2430"/><path d="M10 2H22M2 10V22" stroke="#6B7A8C" fill="none"/><path d="M990 2H978M998 10V22" stroke="#6B7A8C" fill="none"/><path d="M10 428H22M2 420V408" stroke="#6B7A8C" fill="none"/><path d="M990 428H978M998 420V408" stroke="#6B7A8C" fill="none"/><text x="30" y="34" class="m" fill="#5B8CFF" style="fill:#5B8CFF">02 / drive</text><text x="970" y="34" class="m" text-anchor="end">classified</text><text x="50" y="92" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.297;1" dur="1.01s" fill="freeze"/>Some people see a problem and walk away.</text><text x="50" y="124" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.545;1" dur="1.56s" fill="freeze"/>I see an unfinished machine.</text><text x="50" y="174" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.664;1" dur="2.11s" fill="freeze"/>Give me a cave, a box of scraps, and a deadline.</text><text x="50" y="206" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.733;1" dur="2.66s" fill="freeze"/>I'll hand back a tool, a system, an agent that</text><text x="50" y="238" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.779;1" dur="3.21s" fill="freeze"/>works while you sleep — or a world you can walk into.</text><text x="50" y="288" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.811;1" dur="3.76s" fill="freeze"/>Sleep is a deprecated feature.</text><text x="50" y="320" class="f" font-size="20"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.835;1" dur="4.31s" fill="freeze"/>Every prototype is waiting for its Mark II.</text><text x="50" y="400" class="m" >and part of the journey is the end.</text><circle cx="775" cy="225" r="125" fill="none" stroke="#2A3849" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="0 775 225" to="360 775 225" dur="90s" repeatCount="indefinite"/></circle><circle cx="775" cy="225" r="62" fill="none" stroke="#5B8CFF" stroke-opacity=".5"/><circle cx="775" cy="225" r="28" fill="url(#gl)" opacity=".7"/><text x="775" y="236" class="f" text-anchor="middle" font-size="34" style="fill:#FFB347">∞</text><path d="M775 225L775 100" stroke="#2A3849"/><rect x="708.8" y="86" width="132.39999999999998" height="28" rx="14" fill="#10213F" stroke="#5B8CFF"/><text x="775" y="104" class="mi" text-anchor="middle" font-size="12.5">software tools</text><text x="775" y="78" class="m" text-anchor="middle" font-size="10">things that remove work</text><path d="M775 225L900 225" stroke="#2A3849"/><rect x="852.8" y="211" width="94.39999999999999" height="28" rx="14" fill="#10213F" stroke="#5B8CFF"/><text x="900" y="229" class="mi" text-anchor="middle" font-size="12.5">solutions</text><text x="900" y="255" class="m" text-anchor="middle" font-size="10">problem → working system</text><path d="M775 225L775 350" stroke="#2A3849"/><rect x="724.0" y="336" width="102.0" height="28" rx="14" fill="#10213F" stroke="#5B8CFF"/><text x="775" y="354" class="mi" text-anchor="middle" font-size="12.5">agentic ai</text><text x="775" y="380" class="m" text-anchor="middle" font-size="10">models that take action</text><path d="M775 225L650 225" stroke="#2A3849"/><rect x="606.6" y="211" width="86.8" height="28" rx="14" fill="#10213F" stroke="#5B8CFF"/><text x="650" y="229" class="mi" text-anchor="middle" font-size="12.5">game dev</text><text x="650" y="255" class="m" text-anchor="middle" font-size="10">worlds with rules</text><circle r="4" fill="#FFB347"><animateMotion path="M900 225a125 125 0 1 1 -250 0a125 125 0 1 1 250 0" dur="14s" begin="0s" repeatCount="indefinite"/></circle><circle r="3" fill="#5B8CFF"><animateMotion path="M837 225a62 62 0 1 0 -124 0a62 62 0 1 0 124 0" dur="8s" begin="0s" repeatCount="indefinite"/></circle></svg>
