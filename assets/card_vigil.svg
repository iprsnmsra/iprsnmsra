<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160" role="img" aria-label="Vigil project"><title>Vigil project</title><style>
:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--dim:#8b949e;--a:#58a6ff;--b:#f778ba;--star:#ffd33d;--ln:#30363d}
@media (prefers-color-scheme:light){:root{--bg:#fff;--card:#f6f8fa;--fg:#1f2328;--dim:#656d76;--a:#0969da;--b:#bf3989;--star:#d4a72c;--ln:#d0d7de}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fg{fill:var(--fg)}.dim{fill:var(--dim)}.a{fill:var(--a)}.b{fill:var(--b)}
</style><rect x=".5" y=".5" width="299" height="159" rx="12" fill="var(--card)" stroke="var(--ln)"/><rect x=".5" y=".5" width="299" height="159" rx="12" fill="none" stroke="var(--b)" stroke-width="2" pathLength="100" stroke-dasharray="14 86"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="7s" repeatCount="indefinite"/></rect><g transform="translate(252 46)"><path d="M-22 0 Q0 -20 22 0 Q0 20 -22 0Z" fill="none" stroke="var(--a)" stroke-width="2"/><circle r="7" fill="var(--b)"><animate attributeName="cx" values="-8;8;-8" dur="3.2s" repeatCount="indefinite"/></circle><path d="M-22 0 Q0 -20 22 0 Q0 -20 -22 0Z" fill="var(--card)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.9;.95;1;1" dur="4s" repeatCount="indefinite"/></path></g><text class="fg" x="22" y="44" font-size="20" font-weight="800">Vigil</text><text class="dim" x="22" y="74" font-size="13">Always watching, so you never</text><text class="dim" x="22" y="92" font-size="13">have to.</text><text class="a m" x="22" y="124" font-size="10" letter-spacing="1">MONITORING · SYSTEMS</text><text class="dim m" x="22" y="145" font-size="9">↗ github.com/iprsnmsra/vigil</text></svg>