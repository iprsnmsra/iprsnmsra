<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d"><title id="t">System complete</title><desc id="d">Closing signature: build boldly, question everything, leave better systems behind. I am Iron Man.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#18212C"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B8CFF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7A8C"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFB347"/></marker></defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#6B7A8C}.mi{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;fill:#E8ECF1}.ma{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10.5px;fill:#FFB347}.s{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:700;fill:#E8ECF1}.f{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#E8ECF1}</style><rect width="1000" height="320" fill="#090D12"/><rect width="1000" height="320" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="319" fill="none" stroke="#1B2430"/><path d="M10 2H22M2 10V22" stroke="#6B7A8C" fill="none"/><path d="M990 2H978M998 10V22" stroke="#6B7A8C" fill="none"/><path d="M10 318H22M2 310V298" stroke="#6B7A8C" fill="none"/><path d="M990 318H978M998 310V298" stroke="#6B7A8C" fill="none"/><text x="30" y="34" class="m" fill="#5B8CFF" style="fill:#5B8CFF">07 / closure</text><text x="970" y="34" class="m" text-anchor="end">system complete</text><circle cx="140" cy="165" r="78" fill="none" stroke="#2A3849"/><circle cx="140" cy="165" r="56" fill="none" stroke="#5B8CFF" stroke-opacity=".7"/><path d="M170.0 165.0L194.0 165.0" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M164.3 182.6L183.7 196.7" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M149.3 193.5L156.7 216.4" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M130.7 193.5L123.3 216.4" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M115.7 182.6L96.3 196.7" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M110.0 165.0L86.0 165.0" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M115.7 147.4L96.3 133.3" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M130.7 136.5L123.3 113.6" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M149.3 136.5L156.7 113.6" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><path d="M164.3 147.4L183.7 133.3" stroke="#5B8CFF" stroke-width="5" stroke-opacity=".8"/><circle cx="140" cy="165" r="22" fill="none" stroke="#FFB347" stroke-width="2"><animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="140" cy="165" r="8" fill="#FFB347"/><text x="290" y="120" class="f" text-anchor="start" font-size="28">Build boldly.</text><text x="290" y="158" class="f" text-anchor="start" font-size="28">Question everything.</text><text x="290" y="196" class="f" text-anchor="start" font-size="28">Leave better systems behind.</text><path d="M290 252H960" stroke="#1B2430"/><text x="960" y="290" class="s" text-anchor="end" font-size="26" font-style="italic">“I am Iron Man.”</text><path d="M800 298H960" stroke="#5B8CFF" stroke-width="2"/><text x="290" y="276" class="m" >Boku'wa-rekishi ,o tsukuru tame'ni iru, ichibu de-wa nai ≈ ∞</text><text x="290" y="293" class="m" text-anchor="start" style="fill:#FFB347">i