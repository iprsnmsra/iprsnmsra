<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d"><title id="t">Evolution of tools</title><desc id="d">Six pairs of human ability and the artifact it was externalized into: hands to tool, memory to writing, calculation to computer, distance to network, reasoning to intelligence, imagination to worlds. A question mark follows: whoever holds all of these builds what comes next.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#18212C"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B8CFF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7A8C"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFB347"/></marker></defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#6B7A8C}.mi{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;fill:#E8ECF1}.ma{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10.5px;fill:#FFB347}.s{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:700;fill:#E8ECF1}.f{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#E8ECF1}</style><rect width="1000" height="720" fill="#090D12"/><rect width="1000" height="720" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="719" fill="none" stroke="#1B2430"/><path d="M10 2H22M2 10V22" stroke="#6B7A8C" fill="none"/><path d="M990 2H978M998 10V22" stroke="#6B7A8C" fill="none"/><path d="M10 718H22M2 710V698" stroke="#6B7A8C" fill="none"/><path d="M990 718H978M998 710V698" stroke="#6B7A8C" fill="none"/><text x="30" y="34" class="m" fill="#5B8CFF" style="fill:#5B8CFF">06 / evolution</text><text x="970" y="34" class="m" text-anchor="end">ability → artifact → ability</text><path d="M500 620V104" stroke="#2A3849" stroke-width="2"/><path d="M500 170V102" stroke="#5B8CFF" marker-end="url(#ar)"/><circle r="4" fill="#FFB347"><animateMotion path="M500 620V104" dur="9s" begin="0s" repeatCount="indefinite"/></circle><text x="380" y="622" class="s" text-anchor="end" font-size="19">hands</text><text x="380" y="639" class="m" text-anchor="end" >force and reach</text><path d="M396 620H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="620" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="620" r="3" fill="#5B8CFF"/><text x="620" y="622" class="s" text-anchor="start" font-size="19">tool</text><text x="620" y="639" class="m" >stone → lever</text><text x="380" y="532" class="s" text-anchor="end" font-size="19">memory</text><text x="380" y="549" class="m" text-anchor="end" >what we know</text><path d="M396 530H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="530" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="530" r="3" fill="#5B8CFF"/><text x="620" y="532" class="s" text-anchor="start" font-size="19">writing</text><text x="620" y="549" class="m" >memory outside the skull</text><text x="380" y="442" class="s" text-anchor="end" font-size="19">calculation</text><text x="380" y="459" class="m" text-anchor="end" >logic by hand</text><path d="M396 440H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="440" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="440" r="3" fill="#5B8CFF"/><text x="620" y="442" class="s" text-anchor="start" font-size="19">computer</text><text x="620" y="459" class="m" >logic that runs unattended</text><text x="620" y="476" class="ma" >↳ dsa · os · computer architecture</text><text x="380" y="352" class="s" text-anchor="end" font-size="19">distance</text><text x="380" y="369" class="m" text-anchor="end" >reach by travel</text><path d="M396 350H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="350" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="350" r="3" fill="#5B8CFF"/><text x="620" y="352" class="s" text-anchor="start" font-size="19">network</text><text x="620" y="369" class="m" >reach without travel</text><text x="380" y="262" class="s" text-anchor="end" font-size="19">reasoning</text><text x="380" y="279" class="m" text-anchor="end" >thought at human speed</text><path d="M396 260H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="260" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="260" r="3" fill="#5B8CFF"/><text x="620" y="262" class="s" text-anchor="start" font-size="19">intelligence</text><text x="620" y="279" class="m" >reasoning at scale</text><text x="620" y="296" class="ma" >↳ openai api · aws ai practitioner</text><text x="380" y="172" class="s" text-anchor="end" font-size="19">imagination</text><text x="380" y="189" class="m" text-anchor="end" >worlds in the head</text><path d="M396 170H606" stroke="#6B7A8C" stroke-dasharray="3 4" marker-end="url(#ard)"/><circle cx="500" cy="170" r="10" fill="#090D12" stroke="#5B8CFF" stroke-width="2"/><circle cx="500" cy="170" r="3" fill="#5B8CFF"/><text x="620" y="172" class="s" text-anchor="start" font-size="19">worlds</text><text x="620" y="189" class="m" >imagination you can enter</text><text x="620" y="206" class="ma" >↳ unity · unreal · blender</text><text x="500" y="662" class="m" text-anchor="middle" >t = 0 · stone</text><circle cx="500" cy="70" r="26" fill="none" stroke="#FFB347" stroke-dasharray="4 4"><animateTransform attributeName="transform" type="rotate" from="0 500 70" to="360 500 70" dur="40s" repeatCount="indefinite"/></circle><text x="500" y="80" class="f" text-anchor="middle" font-size="30" style="fill:#FFB347">?</text><text x="458" y="66" class="m" text-anchor="end" >collaboration,</text><text x="458" y="80" class="m" text-anchor="end" >not replacement</text><text x="542" y="70" class="f" text-anchor="start" font-size="15">next: built by whoever holds all of it</text><path d="M60 170V620" stroke="#6B7A8C" marker-end="url(#ard)"/><path d="M940 620V170" stroke="#6B7A8C" marker-end="url(#ard)"/><text x="44" y="395" class="m" text-anchor="middle" transform="rotate(-90 44 395)">tools change the people who hold them</text><text x="956" y="395" class="m" text-anchor="middle" transform="rotate(90 956 395)">people build better tools</text></svg>
